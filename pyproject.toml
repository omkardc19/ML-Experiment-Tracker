[project]
name = "exptrack"
version = "0.1.0"
description = "Experiment tracker for ML experiments"
readme = "README.md"
authors = [
    { name = "om", email = "cantshare@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
]

[project.scripts]
exptrack = "exptrack.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
